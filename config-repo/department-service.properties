spring.application.name=departmentrequest-service
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/medichain_request_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
server.error.include-message=always

spring.cloud.openfeign.circuitbreaker.enabled=true

# Circuit breaker for department-service
resilience4j.circuitbreaker.instances.department-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.department-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.department-service.wait-duration-in-open-state=10s
resilience4j.timelimiter.instances.department-service.timeout-duration=3s

# Circuit breaker for product-supplier-service
resilience4j.circuitbreaker.instances.product-supplier-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.product-supplier-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.product-supplier-service.wait-duration-in-open-state=10s
resilience4j.timelimiter.instances.product-supplier-service.timeout-duration=3s

# Circuit breaker for notification-service
resilience4j.circuitbreaker.instances.notification-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.notification-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notification-service.wait-duration-in-open-state=10s
resilience4j.timelimiter.instances.notification-service.timeout-duration=3s

# Fast Eureka cache refresh — pick up registry changes within 5s
eureka.client.registry-fetch-interval-seconds=5

# Circuit breaker for warehouse-inventory-service
resilience4j.circuitbreaker.instances.warehouse-inventory-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.warehouse-inventory-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.warehouse-inventory-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.warehouse-inventory-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.timelimiter.instances.warehouse-inventory-service.timeout-duration=5s
